name: Deploy website to Timeweb

on:
  push:
    branches: [main]
    paths:
      - dist/**
      - .github/workflows/deploy-timeweb.yml
  workflow_dispatch:

concurrency:
  group: timeweb-sftp
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload the latest design
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare production files
        run: |
          mkdir -p _site
          cp dist/variant-2.html _site/index.html
          cp dist/privacy.html _site/privacy.html
          cp dist/personal-data.html _site/personal-data.html
          cp dist/consent.html _site/consent.html
          cp dist/user-agreement.html _site/user-agreement.html
          cp dist/*-bit-finans.html _site/
          cp dist/about.html dist/reviews.html dist/contacts.html _site/
          cp dist/sitemap.xml dist/robots.txt _site/
          cp -R dist/assets _site/assets

      - name: Upload to Timeweb
        env:
          TIMEWEB_SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
        run: |
          test -n "$TIMEWEB_SSH_KEY" || { echo "::error::Set TIMEWEB_SSH_KEY"; exit 1; }
          umask 077
          key_file="$(mktemp)"
          hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$TIMEWEB_SSH_KEY" > "$key_file"
          printf '%s\n' 'vh464.timeweb.ru ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILh9lbCer2VtJU+gZQHlgaCy7ELu11tNsHIymnVWwDfw' > "$hosts_file"
          sftp -i "$key_file" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=15 -b - \
            ci100657@vh464.timeweb.ru <<'SFTP'
          cd bitfin-new/public_html
          put -R _site/assets
          put _site/*.html
          put _site/robots.txt
          put _site/sitemap.xml
          ls -l index.html
          SFTP
