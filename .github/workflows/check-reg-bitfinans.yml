name: Check bitfinans.pro FTP access

on:
  push:
    branches: [check-reg-bitfinans]
    paths:
      - .github/workflows/check-reg-bitfinans.yml
      - dist/*.html
      - dist/favicon.svg

permissions:
  contents: read

concurrency:
  group: reg-bitfinans-migration
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check access and upload the migration bundle
        env:
          FTP_PASSWORD: ${{ secrets.REG_BITFINANS_FTP_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$FTP_PASSWORD" ]]; then
            echo "::error::Add the REG_BITFINANS_FTP_PASSWORD repository secret."
            exit 1
          fi
          if [[ "$FTP_PASSWORD" == *$'\n'* || "$FTP_PASSWORD" == *$'\r'* ]]; then
            echo "::error::The FTP password must occupy one line."
            exit 1
          fi
          password="${FTP_PASSWORD//\\/\\\\}"
          password="${password//\"/\\\"}"
          files=$(printf 'user = "u3734686_bitfinans.pro:%s"\n' "$password" |
            curl --config - --silent --show-error --ssl-reqd \
              --connect-timeout 10 --max-time 25 --list-only \
              ftp://server88.hosting.reg.ru/)
          if ! printf '%s\n' "$files" | tr -d '\r' | grep -Fxq 'index.html'; then
            echo "::error::Login succeeded, but index.html was not found in the FTP root."
            exit 1
          fi
          echo "TLS and FTP login verified. The site index.html is present."
          php -l dist/request.php

          upload() {
            local file="$1"
            local remote="${file#dist/}"
            printf 'user = "u3734686_bitfinans.pro:%s"\n' "$password" |
              curl --config - --silent --show-error --ssl-reqd --ftp-create-dirs \
                --connect-timeout 10 --max-time 120 --upload-file "$file" \
                "ftp://server88.hosting.reg.ru/$remote"
          }

          upload dist/favicon.svg
          for file in dist/*.html; do
            case "$file" in
              dist/index.html|dist/variant-2.html) continue ;;
            esac
            upload "$file"
          done
          upload dist/index.html
          echo "Pages and tab icon updated."
