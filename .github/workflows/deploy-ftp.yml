name: Deploy website to REG.RU by FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload the latest design
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check FTP configuration
        id: ftp-config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ] && [ -n "$FTP_SERVER_DIR" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP deployment is waiting for the four repository secrets described in DEPLOY.md"
          fi

      - name: Prepare production files
        if: steps.ftp-config.outputs.ready == 'true'
        run: |
          mkdir -p _site
          cp dist/variant-2.html _site/index.html
          cp dist/privacy.html _site/privacy.html
          cp dist/personal-data.html _site/personal-data.html
          cp dist/consent.html _site/consent.html
          cp -R dist/assets _site/assets

      - name: Upload to REG.RU
        if: steps.ftp-config.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./_site/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

